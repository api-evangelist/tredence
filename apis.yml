aid: tredence
name: Tredence
description: 'Tredence is a global data science and AI solutions company headquartered
  in San Jose, California, founded in 2013 by Shub Bhowmick, Sumit Mehra and Shashank
  Dubey. The firm positions itself around the "last-mile problem in AI" — the gap between
  insight creation and value realization — and delivers agentic AI, generative AI, data
  engineering, data science, MLOps, LLMOps, data modernization, supply-chain and customer-experience
  analytics as consulting engagements backed by named accelerators and platforms including
  RAPID (agentic process automation), Sancus (AI-led data quality and master data management),
  MLWorks (industrial MLOps), Customer Cosmos, Supply Chain Control Tower, Revenue Growth
  Management, On-Shelf Availability, Test and Learn Platform and UnityGO. It serves retail,
  CPG, healthcare, life sciences, banking/financial services/insurance, telco/media/tech,
  travel and hospitality, and industrials, with delivery centers across North America,
  Europe and Asia. Tredence publishes an authored llms.txt for AI agents and an ISO
  27001:2022 / ISO 27701:2019 / SOC 2 Type 2 certifications page, but does not operate
  a public developer program: no developer portal, API reference, machine-readable
  specification or first-party SDK is published on any Tredence host.'
